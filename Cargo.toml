[profile.release]
# Maximum optimization level for speed
opt-level = 3

# Full Link Time Optimization (LTO) across all crates
lto = "fat"

# Single codegen unit allows for more global optimizations
codegen-units = 1

# hmm... do I want this?
overflow-checks = true

[package]
name = "monero_balance_setter"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "form"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dotenvy = "0.15.7"
